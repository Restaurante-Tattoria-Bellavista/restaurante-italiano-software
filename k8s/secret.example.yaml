# Plantilla del Secret. NO poner claves reales aquí.
#
# Para usarla:
#   1. Copiar este archivo como k8s/secret.yaml (está en .gitignore, nunca se sube).
#   2. Reemplazar cada CAMBIAR_... por un valor propio. En PowerShell se puede generar uno con:
#        [guid]::NewGuid().ToString("N")
#   3. kubectl apply -f k8s/secret.yaml
#
# POSTGRES_PASSWORD solo debe tener letras y números porque va dentro de la URL de conexión.
apiVersion: v1
kind: Secret
metadata:
  name: trattoria-secret
  namespace: trattoria
type: Opaque
stringData:
  POSTGRES_PASSWORD: CAMBIAR_PASSWORD
  # Llave con la que el backend firma los tokens de sesión. Tiene que ser la misma
  # en todas las réplicas; por eso viene de aquí y no se genera en cada pod.
  AUTH_SECRET: CAMBIAR_AUTH_SECRET
  # Token que usan los gateways BLE para enviar lecturas de ubicación.
  GATEWAY_TOKEN: CAMBIAR_GATEWAY_TOKEN
