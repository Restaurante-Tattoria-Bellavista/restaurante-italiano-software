# Construye las imágenes del backend y del frontend y las publica en
# GitHub Container Registry (ghcr.io) cada vez que cambia dev.
# Usa el GITHUB_TOKEN que GitHub crea en cada ejecución, así que no hace
# falta guardar ningún token personal en el repositorio.
name: Publicar imágenes

on:
  push:
    branches:
      - dev
      - "feature/HU-19-*"
    paths:
      - "backend/**"
      - "frontend-react/**"
      - ".github/workflows/imagenes.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: imagenes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publicar:
    name: Imagen ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - servicio: backend
            carpeta: backend
          - servicio: frontend
            carpeta: frontend-react

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      # ghcr.io solo acepta nombres en minúsculas y el de la organización tiene mayúsculas.
      # Las imágenes de dev se etiquetan "dev"; las de la rama de la HU-19 quedan como "prueba".
      - name: Definir nombre y etiqueta de la imagen
        run: |
          echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/trattoria-${{ matrix.servicio }}" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            echo "ETIQUETA=dev" >> "$GITHUB_ENV"
          else
            echo "ETIQUETA=prueba" >> "$GITHUB_ENV"
          fi

      - name: Iniciar sesión en ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.carpeta }}
          push: true
          tags: |
            ${{ env.IMAGEN }}:${{ env.ETIQUETA }}
            ${{ env.IMAGEN }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}